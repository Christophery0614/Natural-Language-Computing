      - linear algebra
      - differential equations
      - statistics help
      - probability question
      - mathematical proof
      - advanced math
    responses:
      - "Advanced mathematics requires a systematic approach. Let's break down your problem into smaller, manageable steps. Could you describe the specific concept or problem you're working on?"
      - "I can help with various advanced math topics including calculus, linear algebra, differential equations, and statistics. Which area are you studying? We'll tackle it step by step."
      - "Mathematics becomes clearer when we understand the underlying concepts. Tell me what you're working on, and I'll help explain both the theory and practical application."

  scientific_writing:
    examples:
      - write scientific paper
      - research paper help
      - scientific writing
      - paper structure
      - academic writing
      - thesis writing
      - dissertation help
    responses:
      - "Scientific writing follows this structure: 1) Abstract 2) Introduction 3) Methods 4) Results 5) Discussion 6) Conclusion. Which section are you working on? I can provide specific guidance."
      - "Let's improve your scientific paper. Key aspects include clarity, precision, proper citations, and logical flow. Would you like to focus on a particular aspect?"
      - "Writing a scientific paper requires both technical accuracy and clear communication. Share your paper's topic, and I'll guide you through the writing process."

  presentation_skills:
