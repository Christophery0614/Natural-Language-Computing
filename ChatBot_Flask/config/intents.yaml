intents:
  greet:
    examples:
      - hi
      - hello
      - hey there
      - good morning
    responses:
      - Hi! How can I help you with your studies today?
      - Hello! What academic questions do you have?

  ask_question:
    examples:
      - how do I solve this problem
      - can you explain this concept
      - help me understand this topic
      - what is the meaning of this term
    responses:
      - I'll help you understand this. Could you provide more details?
      - Let me help you with that. What specific part is unclear?

  homework_help:
    examples:
      - I need help with my homework
      - can you help with this assignment
      - stuck on this exercise
      - how to solve this question
    responses:
      - I'll guide you through this. What's the homework about?
      - Sure, I can help! What subject is this for?

  goodbye:
    examples:
      - bye
      - goodbye
      - thank you, bye
      - see you later
    responses:
      - Goodbye! Good luck with your studies!
      - Bye! Feel free to ask if you have more questions!

  literature_analysis:
    examples:
      - analyze literature
      - literary analysis help
      - character analysis
      - analyze poem
      - analyze text
      - book analysis
      - interpret literature
    responses:
      - "Let's analyze this piece of literature. We'll look at: 1) Theme 2) Characters 3) Plot structure 4) Literary devices 5) Historical context. Which aspect would you like to focus on first?"
      - "Literary analysis requires careful reading and interpretation. Could you share the specific text or passage you're working with? I'll help you break down its key elements."
      - "To understand literature deeply, we should consider the author's background, historical context, and literary techniques. What work are you analyzing? I can guide you through the process."

  research_methodology:
    examples:
      - research methods
      - how to research
      - research design
      - methodology help
      - research approach
      - data collection methods
      - research question help
    responses:
      - "Research methodology typically involves: 1) Defining research questions 2) Selecting appropriate methods 3) Data collection 4) Analysis 5) Drawing conclusions. Which stage are you currently working on?"
      - "Let's develop your research methodology. First, is this qualitative, quantitative, or mixed methods research? This will help us choose the most appropriate approach."
      - "Good research starts with clear questions and objectives. Could you share your research topic? I'll help you design an effective methodology."

  math_advanced:
